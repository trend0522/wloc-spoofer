name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: python3 -m pip install playwright && python3 -m playwright install --with-deps chromium
      - name: start acceptance server (serves local source, proxies /api read-only to live site)
        run: nohup node scripts/serve-acceptance.mjs 8899 &
      - run: curl -fsS --retry 10 --retry-delay 1 http://127.0.0.1:8899/ -o /dev/null
      - run: python3 scripts/acceptance_browser.py
